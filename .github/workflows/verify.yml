name: verify

# Every push and pull request runs the full gate: typecheck, unit, edge typecheck,
# migrations from scratch + SQL suites on PostgreSQL 16, two-session race tests,
# production + demo builds, and the Playwright end-to-end suite against the demo build.
on:
  # develop / main pushes run this gate through deploy.yml (verify → deploy), so it is not run twice
  push:
    branches-ignore: [main, develop]
  pull_request:
  workflow_call:   # deploy.yml runs the full gate first; nothing is deployed unless it passes

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "1"
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      TEST_DB: airec_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Verify (all gates)
        run: npm run verify
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
