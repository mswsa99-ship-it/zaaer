name: functions
# Deploys the Edge Functions ONLY — never a migration. Migrations follow STAGING.md §3-ج (a fresh encrypted backup, a
# restore drill, then a block that checks the file's fingerprint), and anything with a delete is the owner's paste.
# Manual: Actions → functions → Run workflow (optionally name the functions). Needs one repository secret,
# SUPABASE_ACCESS_TOKEN (STAGING.md §3); verify_jwt for each function comes from supabase/config.toml.
on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Functions to deploy, separated by spaces (empty: all of them)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Token present?
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error title=No token::Add the repository secret SUPABASE_ACCESS_TOKEN (STAGING.md §3) and run again."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          WANTED: ${{ inputs.functions }}
        run: |
          set -euo pipefail
          set -a; . ./.env.staging; set +a
          ref="$(sed -E 's#^https://([a-z0-9]+)\.supabase\.co.*#\1#' <<<"$VITE_SUPABASE_URL")"
          all="$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name _shared -printf '%f\n' | sort)"
          list="${WANTED:-$all}"
          for f in $list; do
            if ! grep -qx "$f" <<<"$all"; then echo "::error::unknown function: $f"; exit 1; fi
            if ! grep -q "^\[functions\.$f\]" supabase/config.toml; then echo "::error::$f has no verify_jwt line in supabase/config.toml"; exit 1; fi
          done
          for f in $list; do
            echo "== deploying $f"
            supabase functions deploy "$f" --project-ref "$ref"
          done
          supabase functions list --project-ref "$ref"
