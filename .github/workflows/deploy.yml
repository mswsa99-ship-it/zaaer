name: deploy

# develop → staging (automatic) · main → production (requires approval on the "production" environment)
# Order: full verify gate → database migrations → DB settings (only if missing) → edge functions →
#        function secrets → web build → Netlify deploy → post-deploy smoke checks.
# Every value comes from the GitHub Environment ("staging" / "production") — see STAGING.md §3.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never interrupt a migration half-way

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
      url: ${{ vars.APP_BASE_URL }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      APP_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check required configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          KEYBOX_KEY: ${{ secrets.KEYBOX_KEY }}
          IDENTITY_KEY: ${{ secrets.IDENTITY_KEY }}
        run: |
          missing=0
          # KEYBOX_KEY / IDENTITY_KEY are only needed the first time (when the database does not have them yet)
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_URL VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY NETLIFY_SITE_ID APP_BASE_URL NETLIFY_AUTH_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set for environment $APP_ENV (see STAGING.md §3)"; missing=1; fi
          done
          exit $missing

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Database — apply pending migrations (each migration runs once, in order)
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all

      - name: Database — encryption keys (set once; never rotated by a deploy)
        env:
          KEYBOX_KEY: ${{ secrets.KEYBOX_KEY }}
          IDENTITY_KEY: ${{ secrets.IDENTITY_KEY }}
        run: |
          set -euo pipefail
          for pair in "app.keybox_key:KEYBOX_KEY" "app.identity_key:IDENTITY_KEY"; do
            name="${pair%%:*}"; var="${pair##*:}"
            current=$(psql "$SUPABASE_DB_URL" -tAc "select coalesce(current_setting('$name', true), '')")
            if [ -z "$current" ]; then
              if [ -z "${!var}" ]; then echo "::error::$name is not set in the database and the $var secret is empty"; exit 1; fi
              psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -qc "alter database postgres set $name = '${!var}'"
              echo "$name set"
            else
              echo "$name already set — left unchanged (rotating it would make existing encrypted data unreadable)"
            fi
          done

      - name: Edge functions — deploy
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Edge functions — secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          args="APP_BASE_URL=$APP_BASE_URL"
          # without GEMINI_API_KEY the assistants run their deterministic path (knowledge base + scripted answers)
          if [ -n "$GEMINI_API_KEY" ]; then args="$args GEMINI_API_KEY=$GEMINI_API_KEY"; fi
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" $args

      - name: Web — build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_ENV: ${{ env.APP_ENV }}
          VITE_DEFAULT_BRANCH_ID: ${{ vars.VITE_DEFAULT_BRANCH_ID }}
        run: npm run build

      - name: Web — deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@27.11.2 deploy --dir dist --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "${{ github.sha }} ($APP_ENV)"

      - name: Post-deploy smoke
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: bash scripts/smoke-deployed.sh
