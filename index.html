<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- 5.4 (ق6/SEC-11): نفس سياسة رأس Netlify لكن داخل الصفحة، لأن استضافة GitHub Pages لا ترسل رؤوسًا. frame-ancestors لا تعمل في meta، لذلك يغطيها حارس src/lib/frameGuard.ts بكود. يبقى موثقًا: غياب رؤوس الخادم نفسها ورمز 404 للروابط العميقة (إعدادات الاستضافة، خارج هذا التغيير). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RoomAI" />
    <meta property="og:description" content="ضيافة بلمسة ذكاء. منصة تشغيل للفنادق والشقق الفندقية." />
    <meta property="og:image" content="/og-image.png" />
    <title>RoomAI</title>
</head>
  <body>
    <div id="root">
      <!-- IX-08: shown until the app has loaded, instead of a blank screen on a slow network -->
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--paper);color:var(--ink-muted);font-family:'IBM Plex Sans Arabic','Noto Sans Arabic',system-ui,sans-serif">
        <div style="width:48px;height:48px;border-radius:14px;background:var(--action-fill)"></div>
        <p style="margin:0;font-size:14px">جارٍ التحميل…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
