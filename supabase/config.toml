# Supabase CLI configuration (used by `supabase functions deploy` / `supabase db push` in CI and locally).
# The hosted project's ref is passed at deploy time (--project-ref); nothing environment-specific lives here.
project_id = "zaaer-facility-management"

[db]
major_version = 16

# Public guest endpoint: called by the browser with the public (anon / publishable) key. The function
# validates and rate-limits its own input and never trusts the caller; guest data needs a verified token.
[functions.ai-reception]
verify_jwt = false

# Staff-only endpoints: the platform verifies the signed-in user's JWT before the function runs, and the
# function then reads data AS that user (RLS + role checks), never with elevated rights.
[functions.ai-ops]
verify_jwt = true

[functions.ai-health]
verify_jwt = true

# Guest booking code by WhatsApp: called before sign-in (the guest has no account); the code never leaves the server
[functions.guest-otp]
verify_jwt = false

# Meta calls this for guest messages: no Supabase JWT; every POST must carry the branch's app-secret signature
[functions.whatsapp-webhook]
verify_jwt = false

# Staff replies to WhatsApp threads and the owner's connection test: signed-in staff only
[functions.whatsapp-send]
verify_jwt = true

# The program on a branch's reception computer (WhatsApp Web): no Supabase JWT; every call carries that branch's
# bridge key (x-bridge-key), checked against its SHA-256 (fn_wa_bridge_auth) before anything else runs
[functions.wa-bridge]
verify_jwt = false

# The owner invites a staff member by e-mail (0074): signed-in staff only; the database decides, as the caller, who may
# invite and to which address (fn_admin_staff_invite_target), and the invitation is Supabase Auth's own e-mail
[functions.staff-invite]
verify_jwt = true

# The bank's messages (0066): called by the schedule with its own key (fn_bank_cron_ok) and by the owner's screen with
# a session; no platform JWT check — the function checks both itself (deployed so since 8 Nov)
[functions.bank-mail]
verify_jwt = false

# Separate operator allowlist, checked again by the caller-scoped resolver.
[functions.platform-invite]
verify_jwt = true
